[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csdemo-mapextractor"
version = "0.1.0"
description = "Extract collision geometry from local Counter-Strike 2 maps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
meshopt = [
	"meshoptimizer==0.2.30a0",
	"numpy>=2.0",
]
color = [
	"meshoptimizer==0.2.30a0",
	"numpy>=2.0",
	"open3d>=0.19",
	"pillow>=10",
	"scipy>=1.13",
	"shapely>=2.0",
	"triangle>=20250106",
]
cs2render = [
	"etcpak>=0.9.15",
	"meshoptimizer==0.2.30a0",
	"numpy>=2.0",
	"OpenEXR>=3.3",
	"pillow>=10",
]
cs2sounds = [
	"numpy>=2.0",
]

[project.scripts]
csdemo-mapextractor = "csdemo_mapextractor.cli:main"

[tool.setuptools]
packages = ["csdemo_mapextractor", "csdemo_mapextractor.color", "csdemo_mapextractor.cs2render", "csdemo_mapextractor.cs2sounds"]
package-dir = { csdemo_mapextractor = "extractor" }

[tool.pytest.ini_options]
testpaths = ["tests"]